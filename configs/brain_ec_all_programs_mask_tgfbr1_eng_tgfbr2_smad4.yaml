# Gene Program Interpreter — full brain-EC Perturb-seq annotation.
# Derived from configs/brain_ec_e2e.yaml; runs all 100 cNMF programs and
# excludes the specified TGF-beta/BMP-pathway regulators pipeline-wide before
# regulator ranking, STRING validation, literature research, and annotation.

context:
  organism: mouse
  species_taxid: 10090
  tissue: brain
  cell_type: brain endothelial cell
  conditions: [postnatal development]
  context_terms:
    - blood-brain barrier
    - arteriovenous zonation
    - tight junctions
    - angiogenesis
    - tip cells
    - mechanotransduction
    - transportation
    - metabolism
  assay: Perturb-seq
  report_dataset_crumb: Mouse brain endothelial Perturb-seq

inputs:
  gene_loading: examples/brain_endothelial_demo/FB_moi15_seq2_loading_gene_k100_top300.csv
  regulators: examples/brain_endothelial_demo/Discovery_FP_moi15_seq2_thresh10_k100_default.csv
  celltype_enrichment: examples/brain_endothelial_demo/FP_moi15_seq2_cnmf_program_markers_celltype_l2_top10_enriched_depleted.csv

output_dir: runs/brain_ec_all_programs_mask_tgfbr1_eng_tgfbr2_smad4

# null selects every program in the loading table (100 programs here).
programs: null

# Exclude these regulators before every top-N selection so next-best unmasked
# perturbations are used consistently throughout the report.
mask_regulators:
  - Tgfbr1
  - Eng
  - Tgfbr2
  - Smad4

settings:
  n_top_genes: 300
  top_loading: 15
  top_unique: 8
  top_enrichment: 7
  genes_per_term: 10

research:
  enabled: true
  auth: subscription
  concurrency: 8
  model: claude-sonnet-4-6
  max_turns: 30
  max_budget_usd: 1.0
  per_program_timeout: 600

annotation:
  model: claude-sonnet-4-6
  max_tokens: 8192
  batch: true
  batch_size: 25

theme:
  enabled: true
  model: claude-sonnet-4-6
  min_generic_program_count: 4

presentation:
  model: claude-haiku-4-5-20251001
  deterministic_fallback: true
